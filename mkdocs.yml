site_name: Synthesize Knowledge
site_description: Kho tri thức kỹ thuật chuyên sâu bằng tiếng Việt
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: vi
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - vi
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

